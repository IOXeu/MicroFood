<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Procura-se & Oportunidades</title>
<style>:root{--ink:#20382c;--green:#245c42;--line:#d9d5c9;--muted:#66736a;--accent:#e97843;--bad:#a23024}*{box-sizing:border-box}body{margin:0;background:#faf7f2;color:var(--ink);font:16px/1.55 system-ui,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.55}.wrap{width:min(860px,calc(100% - 24px));margin:auto;padding:20px 0 60px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:18px}h1{font-size:26px;margin:0 0 6px}.muted{color:var(--muted);font-size:14px}.grid{display:grid;gap:12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px}label{font-size:13px;font-weight:750}input,textarea,select{padding:11px;border:1px solid #c8ccc3;border-radius:10px;width:100%;background:#fff}textarea{min-height:90px;resize:vertical}.btn{border:0;background:var(--green);color:#fff;padding:12px 16px;border-radius:10px;font-weight:800;cursor:pointer}.btn.secondary{background:#fff;color:inherit;border:1px solid var(--line)}.status{font-size:14px;white-space:pre-line}.status.bad{color:var(--bad)}.status.good{color:var(--good)}.ads{display:grid;gap:12px}.ad{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}.ad header{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px}.tag{font-size:11px;font-weight:850;padding:4px 9px;border-radius:99px;background:#eef3ef;color:var(--green)}.ad h3{margin:0 0 5px;font-size:18px}.ad p{margin:0 0 10px;font-size:14px;color:#4a5a50}.wa{display:inline-block;background:#25d366;color:#fff;text-decoration:none;font-weight:800;padding:9px 14px;border-radius:9px;font-size:14px}.empty{text-align:center;color:var(--muted);padding:30px 0}.rules{font-size:13px;color:var(--muted)}@media(max-width:600px){.two{grid-template-columns:1fr}}</style></head>
<body><div class="wrap">
<div class="card"><h1>Procura-se & Oportunidades</h1><p class="muted">Entregadores, fornecedores, lojistas e oportunidades locais. Os anúncios são analisados automaticamente; conteúdo fora das normas é removido. A plataforma não participa da negociação.</p></div>
<div class="card"><h2 style="margin:0 0 12px;font-size:18px">Publicar anúncio</h2><form id="f" class="grid"><div class="two"><div class="field"><label>Tipo</label><select id="type"><option value="procura_entregador">Procura-se entregador</option><option value="entregador_disponivel">Entregador disponível</option><option value="procura_fornecedor">Procura-se fornecedor</option><option value="fornecedor_disponivel">Fornecedor disponível</option><option value="vendo">Vendo / oportunidade</option></select></div><div class="field"><label>Cidade</label><input id="city" maxlength="60" placeholder="São José do Rio Preto"></div></div><div class="field"><label>Título</label><input id="title" required maxlength="90" placeholder="Procura-se entregador para noite"></div><div class="field"><label>Descrição</label><textarea id="description" required maxlength="500" placeholder="Informe região, horário, tipo de trabalho e forma de pagamento."></textarea></div><div class="two"><div class="field"><label>Região / bairro</label><input id="region" maxlength="80"></div><div class="field"><label>WhatsApp</label><input id="whatsapp" inputmode="numeric" placeholder="5517999999999"></div></div><button class="btn" type="submit">Enviar para análise</button><div id="msg" class="status"></div></form></div>
<div class="card"><h2 style="margin:0 0 12px;font-size:18px">Anúncios ativos</h2><div id="ads" class="ads"><div class="empty">Carregando…</div></div></div>
</div>
<script>(()=>{'use strict';const $=s=>document.querySelector(s);const TYPES={procura_entregador:'Procura-se entregador',entregador_disponivel:'Entregador disponível',procura_fornecedor:'Procura-se fornecedor',fornecedor_disponivel:'Fornecedor disponível',vendo:'Vendo / oportunidade'};
function msg(t,c=''){const e=$('#msg');e.textContent=t;e.className='status '+c}
async function load(){const box=$('#ads');box.innerHTML='<div class="empty">Carregando…</div>';try{const r=await fetch('/api/ads');const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Falha ao carregar.');const ads=d.ads||[];if(!ads.length){box.innerHTML='<div class="empty">Nenhum anúncio ativo agora.</div>';return}box.replaceChildren();for(const a of ads){const el=document.createElement('article');el.className='ad';el.innerHTML=`<header><span class="tag"></span><small class="muted"></small></header><h3></h3><p></p><a class="wa" target="_blank" rel="noopener noreferrer">Falar no WhatsApp</a>`;el.querySelector('.tag').textContent=TYPES[a.ad_type]||a.ad_type;el.querySelector('.muted').textContent=[a.city,a.region].filter(Boolean).join(' · ');el.querySelector('h3').textContent=a.title;el.querySelector('p').textContent=a.description;el.querySelector('.wa').href=`https://wa.me/${a.whatsapp_number}`;box.append(el)}}catch(e){box.innerHTML=`<div class="empty">${e.message}</div>`}}
$('#f').addEventListener('submit',async e=>{e.preventDefault();msg('Analisando anúncio…');const b={adType:$('#type').value,title:$('#title').value.trim(),description:$('#description').value.trim(),city:$('#city').value.trim(),region:$('#region').value.trim(),whatsappNumber:$('#whatsapp').value.replace(/\D/g,'')};try{const r=await fetch('/api/ads',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Falha ao enviar.');if(d.published){msg('Anúncio aprovado e publicado.','good');$('#f').reset();load()}else{msg('Anúncio removido automaticamente por violar as normas do mural.','bad')}}catch(err){msg(err.message,'bad')}});
load();})();
</script></body></html>
