<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cardápio</title>
<style>:root{--accent:#e63946;--ink:#222;--muted:#666}*{box-sizing:border-box}body{margin:0;background:#faf7f2;color:var(--ink);font:16px/1.55 system-ui,sans-serif}img{display:block;max-width:100%;object-fit:cover}.hero{position:relative}.hero img{width:100%;height:230px;background:#ddd}.hero .overlay{position:absolute;inset:0;background:linear-gradient(0deg,#000c,transparent 65%);color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:20px}.hero h1{margin:0;font-size:30px}.hero p{margin:5px 0 0;opacity:.9;font-size:14px}.notice{background:#fff6d8;border-bottom:1px solid #eadfae;padding:10px 16px;font-size:13px}.wrap{width:min(760px,calc(100% - 26px));margin:auto;padding:18px 0 100px}.cat{font-weight:850;margin:22px 0 10px;text-transform:uppercase;letter-spacing:.08em;font-size:13px;color:var(--muted)}.item{background:#fff;border:1px solid #e5e0d3;border-radius:14px;padding:14px;margin-bottom:10px;display:grid;grid-template-columns:1fr auto;gap:10px}.item h3{margin:0;font-size:17px}.item p{margin:4px 0 0;font-size:13px;color:var(--muted)}.item .price{font-weight:850;color:var(--accent)}.qty{display:flex;align-items:center;gap:8px}.qty button{width:32px;height:32px;border-radius:8px;border:1px solid #ccc;background:#fff;font-weight:800}.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #ddd;padding:12px 16px;display:flex;justify-content:space-between;gap:12px;align-items:center;box-shadow:0 -6px 20px #0001}.bar button{border:0;background:var(--accent);color:#fff;padding:12px 18px;border-radius:10px;font-weight:800}.empty{text-align:center;color:var(--muted);padding:40px 0}.modal{position:fixed;inset:0;background:#0008;display:none;place-items:center;padding:16px;z-index:9}.modal.open{display:grid}.box{background:#fff;border-radius:14px;padding:20px;width:min(460px,100%);max-height:92vh;overflow:auto}.box input,.box select{width:100%;padding:11px;border:1px solid #ccc;border-radius:9px;margin:6px 0 12px}.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.mode{border:1px solid #ccc;border-radius:10px;padding:10px;text-align:center;background:#fff}.mode[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 2px #e6394633}.courier{border:1px solid #ddd;border-radius:10px;padding:10px;margin:8px 0;display:flex;justify-content:space-between;gap:8px;align-items:center}.courier[aria-pressed=true]{border-color:var(--accent);background:#fff5f4}.btn{border:0;background:var(--accent);color:#fff;padding:12px 16px;border-radius:10px;font-weight:800;cursor:pointer}.btn.secondary{background:#fff;color:#222;border:1px solid #ccc}.status{font-size:13px;margin-top:8px;white-space:pre-line}.status.bad{color:#a23024}.small{font-size:12px;color:#666}</style></head>
<body><div id="app"><div class="empty">Carregando cardápio…</div></div>
<div class="bar hidden" id="bar"><strong id="total">R$ 0,00</strong><button id="send">Finalizar</button></div>
<div class="modal" id="modal"><div class="box"><h3>Finalizar pedido</h3>
<div class="modes"><button class="mode" id="m-pickup" aria-pressed="true">Retirar na loja</button><button class="mode" id="m-delivery" aria-pressed="false">Entrega</button></div>
<div id="delivery-box" class="hidden"><label>CEP de entrega</label><input id="cep" inputmode="numeric" maxlength="9" placeholder="15015-000"><button class="btn secondary" id="calc" type="button">Consultar entregadores</button><div id="couriers"></div><div class="status" id="dstatus"></div></div>
<label>Seu nome</label><input id="cname" maxlength="60"><label>Mesa / observação</label><input id="ctable" maxlength="40">
<div class="status" id="mstatus"></div>
<div style="display:flex;gap:10px;margin-top:10px"><button class="btn secondary" onclick="document.getElementById('modal').classList.remove('open')">Voltar</button><button class="btn" id="confirm">Enviar ao caixa</button></div>
</div></div>
<script>
(()=>{'use strict';const q=new URLSearchParams(location.search);const merchant=q.get('loja'),table=q.get('mesa')||'',qr=q.get('qr')||'';
const cart={};let store=null,products=[],mode='pickup',couriers=[],selectedCourier=null,delivery=null;
const $=s=>document.querySelector(s);const money=c=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(c/100);
function render(){const app=$('#app');if(!store){app.innerHTML='<div class="empty">Loja não encontrada ou não publicada.</div>';return}
document.title=store.store_name||'Cardápio';document.documentElement.style.setProperty('--accent',store.primary_color||'#e63946');
let html=`<div class="hero">${store.cover_image_url?`<img src="${store.cover_image_url}" alt="">`:''}<div class="overlay"><h1>${store.store_name||'Cardápio'}</h1><p>${store.description||''}</p></div></div>`;
if(store.announcement)html+=`<div class="notice">${store.announcement}</div>`;html+='<div class="wrap">';
if(table)html+=`<p><strong>Mesa ${table}</strong></p>`;
const cats=[...new Set(products.map(p=>p.category||'Cardápio'))];
if(!products.length)html+='<div class="empty">A loja ainda não publicou produtos.</div>';
for(const c of cats){html+=`<div class="cat">${c}</div>`;for(const p of products.filter(x=>(x.category||'Cardápio')===c)){const n=cart[p.id]||0;html+=`<div class="item"><div><h3>${p.name}</h3><p>${p.description||''}</p><div class="price">${money(p.price_cents)}</div></div><div class="qty"><button data-dec="${p.id}">−</button><span>${n}</span><button data-inc="${p.id}">+</button></div></div>`}}
html+='</div>';app.innerHTML=html;
app.querySelectorAll('[data-inc]').forEach(b=>b.addEventListener('click',()=>{cart[b.dataset.inc]=(cart[b.dataset.inc]||0)+1;render()}));
app.querySelectorAll('[data-dec]').forEach(b=>b.addEventListener('click',()=>{const id=b.dataset.dec;if(cart[id]){cart[id]--;if(!cart[id])delete cart[id];render()}}));updateBar()}
function items(){return products.filter(p=>cart[p.id]).map(p=>({id:p.id,name:p.name,qty:cart[p.id],price_cents:p.price_cents}))}
function subtotal(){return items().reduce((s,p)=>s+p.qty*p.price_cents,0)}
function deliveryFee(){return mode==='delivery'&&selectedCourier?selectedCourier.feeCents:0}
function updateBar(){const n=Object.values(cart).reduce((a,b)=>a+b,0);$('#bar').classList.toggle('hidden',!n);$('#total').textContent=`${n} item(ns) · ${money(subtotal()+deliveryFee())}`}
function setMode(m){mode=m;selectedCourier=null;$('#m-pickup').setAttribute('aria-pressed',String(m==='pickup'));$('#m-delivery').setAttribute('aria-pressed',String(m==='delivery'));$('#delivery-box').classList.toggle('hidden',m!=='delivery');updateBar()}
$('#m-pickup').addEventListener('click',()=>setMode('pickup'));$('#m-delivery').addEventListener('click',()=>setMode('delivery'));
$('#send').addEventListener('click',()=>{$('#ctable').value=table;$('#modal').classList.add('open');setMode(mode)});
$('#calc').addEventListener('click',async()=>{const st=$('#dstatus');st.textContent='Consultando…';st.className='status';$('#couriers').replaceChildren();try{const r=await fetch('/api/delivery/calculate',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({deliveryCep:$('#cep').value.replace(/\D/g,'')})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Falha ao consultar.');couriers=d.options||[];delivery={lat:d.deliveryLatitude,lng:d.deliveryLongitude};if(!couriers.length){st.textContent='Nenhum entregador disponível para esta distância.';return}const box=$('#couriers');for(const c of couriers){const b=document.createElement('button');b.type='button';b.className='courier';b.innerHTML=`<span><strong></strong><div class="small"></div></span><strong></strong>`;b.querySelector('strong').textContent=c.name;b.querySelector('.small').textContent=`${c.distanceKm} km`;b.lastElementChild.textContent=money(c.feeCents);b.addEventListener('click',()=>{selectedCourier=c;box.querySelectorAll('.courier').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');updateBar()});box.append(b)}st.textContent='Escolha um entregador.'}catch(e){st.textContent=e.message;st.className='status bad'}});
$('#confirm').addEventListener('click',async()=>{const st=$('#mstatus');st.textContent='Enviando…';st.className='status';const its=items();if(!its.length){st.textContent='Escolha itens do cardápio.';return}
if(mode==='delivery'&&!selectedCourier){st.textContent='Escolha um entregador disponível.';return}
try{const r=await fetch('/api/public/order',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({merchantId:merchant,tableNumber:$('#ctable').value.trim(),customerName:$('#cname').value.trim(),items:its,totalCents:subtotal()+deliveryFee(),orderType:mode,qrCode:qr,courierId:selectedCourier?.courierId||null,courierFeeCents:deliveryFee(),distanceKm:selectedCourier?.distanceKm||null,deliveryCep:$('#cep').value.replace(/\D/g,'')})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Falha ao enviar.');if(d.whatsappUrl){location.assign(d.whatsappUrl);return}st.textContent='Pedido registrado.'}catch(e){st.textContent=e.message;st.className='status bad'}});
(async()=>{try{const r=await fetch(`/api/public/store?merchantId=${encodeURIComponent(merchant||'')}${qr?`&qr=${encodeURIComponent(qr)}`:''}`);const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Loja não encontrada.');store=d.store;products=(d.products||[]).filter(p=>p.is_active);render()}catch(e){$('#app').innerHTML=`<div class="empty">${e.message}</div>`}})();
})();
</script></body></html>
