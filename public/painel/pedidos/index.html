<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Pedidos da loja</title>
<style>:root{--ink:#20382c;--green:#245c42;--line:#d9d5c9;--muted:#66736a;--bad:#a23024;--good:#1d6b40;--warn:#8a5a12}*{box-sizing:border-box}body{margin:0;background:#f7f5ee;color:var(--ink);font:15px/1.55 system-ui,sans-serif}button,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.55}.wrap{width:min(900px,calc(100% - 24px));margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}.brand{font-weight:850}.brand span{display:inline-grid;place-items:center;width:29px;height:29px;background:#e97843;color:#fff;border-radius:10px 10px 10px 3px;margin-right:6px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin:16px 0}h1{font-size:23px;margin:0 0 6px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.btn{border:0;background:var(--green);color:#fff;padding:10px 14px;border-radius:10px;font-weight:750;text-decoration:none;cursor:pointer}.btn.secondary{background:#fff;color:inherit;border:1px solid var(--line)}.status{font-size:14px;white-space:pre-line}.status.bad{color:var(--bad)}.status.good{color:var(--good)}.orders{display:grid;gap:12px}.order{border:1px solid var(--line);border-radius:12px;padding:14px}.order header{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px}.tag{font-size:11px;font-weight:850;padding:4px 9px;border-radius:99px}.tag.mesa{background:#e8f0fb;color:#24518a}.tag.retirada{background:#eaf6ee;color:#1d6b40}.tag.entrega{background:#fdf0d5;color:#8a5a12}.tag.sent{background:#eef;color:#345}.tag.preparing{background:#fff3cd;color:#8a5a12}.tag.ready{background:#e2f5e8;color:#1d6b40}.tag.delivered{background:#eee;color:#555}.items{margin:8px 0;padding-left:18px}.items li{margin:3px 0;font-size:14px}.total{font-weight:850}.small{font-size:12px;color:var(--muted)}.empty{text-align:center;color:var(--muted);padding:30px 0}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.filters button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 13px}.filters button[aria-pressed=true]{background:var(--ink);color:#fff}</style></head>
<body><div class="wrap"><header class="top"><div class="brand"><span>M</span>Pedidos da loja</div><div class="row"><a class="btn secondary" href="/painel/">Voltar</a><button id="reload" class="btn" type="button">Atualizar</button></div></header>
<div id="msg" class="status"></div><div class="filters" id="filters"></div><div id="list" class="orders"></div></div>
<script>(()=>{'use strict';const $=s=>document.querySelector(s);let orders=[],filter='todos';
const money=c=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(c/100);
const label={sent:'Recebido',preparing:'Em preparo',ready:'Pronto',delivered:'Entregue'};
const kind=o=>o.table_number?'mesa':(o.order_type==='delivery'?'entrega':'retirada');
function msg(t,c=''){const e=$('#msg');e.textContent=t;e.className='status '+c}
async function api(p,o={}){const r=await fetch(p,{...o,headers:{'content-type':'application/json',...(o.headers||{})}});if(r.status===401){location.replace('/painel/entrar/');throw new Error('Sessão expirada.')}const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Falha.');return d}
function render(){const box=$('#list');box.replaceChildren();const list=orders.filter(o=>filter==='todos'||kind(o)===filter);
if(!list.length){box.innerHTML='<div class="empty">Nenhum pedido neste filtro.</div>';return}
for(const o of list){const d=document.createElement('article');d.className='order';const k=kind(o);
d.innerHTML=`<header><div><strong></strong><div class="small"></div></div><span class="tag ${k}"></span></header><ul class="items"></ul><div class="row" style="justify-content:space-between"><span class="total"></span><span class="row"></span></div>`;
d.querySelector('strong').textContent=(o.customer_name||'Cliente')+' · '+money(o.total_cents);
d.querySelector('.small').textContent=new Date(o.created_at+(o.created_at.endsWith('Z')?'':'Z')).toLocaleString('pt-BR');
const tag=d.querySelector('.tag');tag.textContent=(k==='mesa'?`Mesa ${o.table_number}`:k==='entrega'?'Entrega':'Retirada')+' · '+(label[o.status]||o.status);tag.className='tag '+k+' '+o.status;
const ul=d.querySelector('.items');for(const line of JSON.parse(o.items_json||'[]')){const li=document.createElement('li');li.textContent=line;ul.append(li)}
const total=d.querySelector('.total');let extra='';if(o.order_type==='delivery'&&o.courier_fee_cents)extra=` · Entrega ${money(o.courier_fee_cents)}${o.distance_km?` (${o.distance_km} km)`:''}`;total.textContent='Total: '+money(o.total_cents)+extra;
const actions=d.querySelector('.row:last-child');const sel=document.createElement('select');for(const s of ['sent','preparing','ready','delivered']){const op=document.createElement('option');op.value=s;op.textContent=label[s];if(s===o.status)op.selected=true;sel.append(op)}sel.addEventListener('change',async()=>{await api('/api/store/orders',{method:'PATCH',body:JSON.stringify({id:o.id,status:sel.value})});load()});actions.append(sel);
if(o.order_type==='delivery'&&o.courier_id){const a=document.createElement('a');a.className='btn secondary';a.target='_blank';a.rel='noopener';a.href=`https://wa.me/${o.courier_phone||''}`;a.textContent='Falar com entregador';actions.append(a)}
box.append(d)}}
function renderFilters(){const f=$('#filters');f.replaceChildren();for(const [v,t] of [['todos','Todos'],['mesa','Mesa'],['retirada','Retirada'],['entrega','Entrega']]){const b=document.createElement('button');b.type='button';b.textContent=t;b.setAttribute('aria-pressed',String(filter===v));b.addEventListener('click',()=>{filter=v;renderFilters();render()});f.append(b)}}
async function load(){msg('Carregando…');try{const d=await api('/api/store/orders');orders=d.orders||[];render();msg(`${orders.length} pedido(s). Atualiza automaticamente a cada 20 segundos.`,'good')}catch(e){msg(e.message,'bad')}}
$('#reload').addEventListener('click',load);renderFilters();load();setInterval(load,20000);})();
</script></body></html>
