<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Publicar no mural</title>
<style>:root{--ink:#20382c;--green:#245c42;--line:#d9d5c9;--muted:#66736a}*{box-sizing:border-box}body{margin:0;background:#f7f5ee;color:var(--ink);font:15px/1.55 system-ui,sans-serif}.wrap{width:min(720px,calc(100% - 24px));margin:auto}.top{display:flex;justify-content:space-between;align-items:center;padding:18px 0;border-bottom:1px solid var(--line)}.brand{font-weight:850}.brand span{display:inline-grid;place-items:center;width:30px;height:30px;background:#e97843;color:#fff;border-radius:10px 10px 10px 3px;margin-right:6px}.btn{border:0;background:var(--green);color:#fff;padding:10px 15px;border-radius:10px;font-weight:750;cursor:pointer;text-decoration:none}.btn.secondary{background:#fff;color:inherit;border:1px solid var(--line)}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;margin:18px 0}h1{font-size:23px;margin:0 0 6px}.muted{color:var(--muted);font-size:14px}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}.field label{font-size:13px;font-weight:750}.field input,.field textarea{padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}.field textarea{min-height:130px;resize:vertical}.msg{margin-top:12px;font-size:14px;white-space:pre-line}.ok{color:#1d6b40}.bad{color:#a23024}.post{border-top:1px solid var(--line);padding:12px 0}.post b{display:block}.post small{color:var(--muted)}</style></head>
<body><div class="wrap"><header class="top"><div class="brand"><span>M</span>Mural Procura-se</div><a class="btn secondary" href="/painel/">Voltar</a></header>
<div class="card"><h1>Publicar anúncio</h1><p class="muted">O anúncio sai no seu nome e fica vinculado à sua conta. A IA revisa antes de publicar.</p>
<div class="field"><label>Título</label><input id="title" placeholder="Ex.: Procuro entregador para região central"></div>
<div class="field"><label>Descrição</label><textarea id="content" placeholder="Explique a vaga, região, horário e forma de contato."></textarea></div>
<button id="publish" class="btn" type="button">Enviar para revisão da IA</button><div id="msg" class="msg"></div></div>
<div class="card"><h2>Meus anúncios</h2><div id="posts">Carregando…</div></div></div>
<script>(()=>{'use strict';const $=s=>document.querySelector(s);
async function j(u,o){const r=await fetch(u,o);const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||('Erro '+r.status));return d}
async function load(){try{const d=await j('/api/mural/my-posts');$('#posts').innerHTML=(d.posts||[]).map(p=>`<div class="post"><b>${p.title}</b><div>${p.content}</div><small>${p.author_name||''} · ${p.status||''} · ${p.created_at||''}</small></div>`).join('')||'<p class="muted">Você ainda não publicou anúncios.</p>'}catch(e){$('#posts').textContent=e.message}}
$('#publish').addEventListener('click',async()=>{const m=$('#msg');try{await j('/api/mural/publish',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:$('#title').value.trim(),content:$('#content').value.trim()})});$('#title').value='';$('#content').value='';m.textContent='Anúncio aprovado pela IA e publicado.';m.className='msg ok';load()}catch(e){m.textContent=e.message;m.className='msg bad'}});
load();})();
</script></body></html>
