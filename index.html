<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SoCialBr</title>
<style>
:root{--bg:#1E1626;--pn:#2A1F3B;--cd:#3A2A56;--tx:#F5EEF7;--t2:#C9B5D9;--ro:#8A5CC8;--du:#FFD166}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:640px;margin:auto;padding:16px}h1{color:var(--du);margin:.2em 0}h2{margin:.6em 0}
.c{background:var(--pn);border-radius:12px;padding:12px;margin:10px 0}small{color:var(--t2)}
input,textarea{width:100%;padding:10px;border-radius:8px;border:1px solid var(--cd);background:var(--bg);color:var(--tx);font:inherit}
button{background:var(--ro);color:#fff;border:0;border-radius:8px;padding:10px 14px;margin:4px 4px 4px 0;font:inherit;cursor:pointer}
button.o{background:var(--cd)}button.p{background:var(--du);color:#1E1626}.av{background:#5a3b12;border-radius:8px;padding:10px;margin:8px 0}
</style></head><body><main id="app"></main>
<script>
const $=document.getElementById('app'),K='sb_token',C='sb_convite';let me=null,gid=null;
const h=(t,a,...k)=>{const e=document.createElement(t);Object.assign(e,a||{});k.flat().forEach(x=>e.append(x??''));return e};
const api=async(p,b,m)=>{const r=await fetch('/api/'+p,{method:m||(b?'POST':'GET'),headers:{'content-type':'application/json',authorization:'Bearer '+(localStorage[K]||'')},body:b?JSON.stringify(b):undefined});
 const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.erro||'Erro');return d};
const ok=f=>async()=>{try{await f()}catch(e){alert(e.message)}};
const show=(...k)=>{$.replaceChildren(h('h1',0,'SoCialBr'),...k)};
const dia=t=>new Date(t).toLocaleDateString('pt-BR');

async function start(){
 const q=new URLSearchParams(location.search).get('convite');if(q){localStorage[C]=q;history.replaceState(0,'','/')}
 if(!localStorage[K])return entrar();
 try{me=await api('eu')}catch{delete localStorage[K];return entrar()}
 if(localStorage[C]){const t=localStorage[C];delete localStorage[C];try{const r=await api('convites/aceitar',{token:t});return grupo(r.group_id)}catch(e){alert(e.message)}}
 lista();
}
function entrar(){
 const n=h('input',{placeholder:'Seu nome'});
 show(h('div',{className:'c'},h('h2',0,localStorage[C]?'Voce foi convidado! Como quer ser chamado?':'Bem-vindo'),n,
  h('button',{className:'p',onclick:ok(async()=>{const r=await api('registrar',{nome:n.value});localStorage[K]=r.token;start()})},'Entrar')),
  h('small',0,'Sem e-mail e sem senha. Este aparelho guarda sua chave de acesso.'));
}
async function lista(){
 const gs=await api('grupos'),n=h('input',{placeholder:'Nome do novo grupo'});
 show(h('small',0,'Ola, '+me.nome),h('h2',0,'Seus grupos'),
  ...gs.map(g=>h('div',{className:'c'},h('b',0,g.nome),' ',h('small',0,g.meu_status==='ativo'?'':'(despedida ate '+dia(g.despedida_ate)+')'),h('br'),h('button',{onclick:()=>grupo(g.id)},'Abrir'))),
  h('div',{className:'c'},n,h('button',{className:'p',onclick:ok(async()=>{const r=await api('grupos',{nome:n.value});grupo(r.id)})},'Criar grupo')));
}
async function grupo(id){
 gid=id;const d=await api('grupos/'+id+'/posts'),ativo=d.eu.status==='ativo'&&d.grupo.status==='ativo',t=h('textarea',{rows:3,placeholder:'Compartilhe uma novidade...'});
 const meus=d.membros.filter(x=>x.invited_by===me.id&&x.status==='ativo');
 show(h('button',{className:'o',onclick:lista},'< Grupos'),h('h2',0,d.grupo.nome),
  !ativo?h('div',{className:'av'},'Despedida: modo leitura ate '+dia(d.eu.despedida_ate||0)+'. Depois disso tudo e apagado. ',
   d.eu.despedida_por===me.id?h('button',{className:'p',onclick:ok(async()=>{await api('grupos/'+id+'/voltar',{});grupo(id)})},'Voltar ao grupo'):''):'',
  ativo?h('div',{className:'c'},t,h('button',{className:'p',onclick:ok(async()=>{await api('grupos/'+id+'/posts',{texto:t.value});grupo(id)})},'Publicar')):'',
  ativo?h('button',{onclick:ok(async()=>{const r=await api('grupos/'+id+'/convites',{}),l=location.origin+'/?convite='+r.token;
    if(navigator.share)try{await navigator.share({title:'SoCialBr',text:'Entre no meu grupo no SoCialBr:',url:l});return}catch{}
    try{await navigator.clipboard.writeText(l);alert('Convite copiado! Cole no WhatsApp. Ele vale para 1 pessoa.')}catch{prompt('Copie o convite:',l)}})},'Convidar amigo'):'',
  ...d.posts.map(p=>h('div',{className:'c'},h('b',0,p.nome),' ',h('small',0,new Date(p.criado_em).toLocaleString('pt-BR')),h('div',0,p.texto))),
  meus.length?h('div',{className:'c'},h('b',0,'Quem voce convidou'),...meus.map(x=>h('div',0,x.nome,' ',h('button',{className:'o',onclick:ok(async()=>{if(confirm('Retirar '+x.nome+' e quem ele convidou? As publicacoes deles serao apagadas em 30 dias.')){await api('grupos/'+id+'/remover',{user_id:x.user_id});grupo(id)}})},'Retirar')))):'',
  ativo?h('button',{className:'o',onclick:ok(async()=>{const s=await api('grupos/'+id+'/saida');
    if(confirm('Ao sair, '+s.afetados+' convidado(s) seu(s) tambem serao removidos. As publicacoes serao apagadas em 30 dias. Confirmar?')){await api('grupos/'+id+'/sair',{});lista()}})},'Sair do grupo'):'');
}
start();
</script></body></html>
